<svg width="1000" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0B0F19"/>
      <stop offset="25%"  stop-color="#00F5FF"/>
      <stop offset="50%"  stop-color="#7B2EFF"/>
      <stop offset="75%"  stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0B0F19" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#7B2EFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" fill="url(#bg)"/>

  <!-- Dark overlay for readability -->
  <rect width="1000" height="280" fill="#0B0F19" opacity="0.55"/>

  <!-- Wave shape bottom -->
  <path d="M0 180 Q 250 230 500 200 T 1000 220 L1000 280 L0 280 Z" fill="#0B0F19" opacity="0.7"/>
  <path d="M0 200 Q 250 170 500 210 T 1000 195 L1000 280 L0 280 Z" fill="url(#wave1)" opacity="0.4"/>

  <!-- Cyan glow circle left -->
  <circle cx="80" cy="80" r="60" fill="#00F5FF" opacity="0.07"/>
  <!-- Purple glow circle right -->
  <circle cx="920" cy="180" r="80" fill="#7B2EFF" opacity="0.1"/>

  <!-- Name -->
  <text
    x="500" y="115"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="58"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="middle"
    style="letter-spacing:2px"
  >Tushar Sahu</text>

  <!-- Cyan underline accent -->
  <rect x="350" y="132" width="300" height="3" rx="2" fill="#00F5FF" opacity="0.8"/>

  <!-- Subtitle -->
  <text
    x="500" y="175"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="19"
    font-weight="400"
    fill="#00F5FF"
    text-anchor="middle"
    dominant-baseline="middle"
    style="letter-spacing:1px"
  >Full Stack  |  AI/ML  |  Cloud &amp; DevOps Engineer</text>
</svg>
