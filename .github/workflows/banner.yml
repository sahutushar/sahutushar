name: Generate Hero Banner PNG

on:
  push:
    paths:
      - 'hero-banner.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert SVG to PNG
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1000 hero-banner.svg -o hero-banner.png

      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hero-banner.png
          git diff --cached --quiet || git commit -m "chore: regenerate hero-banner.png from SVG"
          git push
