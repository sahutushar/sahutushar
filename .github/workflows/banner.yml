name: Generate Hero Banner PNG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download SVG banner
        run: |
          curl -s -o hero-banner.svg "https://capsule-render.vercel.app/api?type=waving&color=0:0B0F19,25:00F5FF,50:7B2EFF,75:00F5FF,100:0B0F19&height=280&section=header&text=Tushar%20Sahu&fontSize=55&fontColor=ffffff&animation=fadeIn&fontAlignY=40&desc=Full%20Stack%20%7C%20AI%2FML%20%7C%20Cloud%20%26%20DevOps%20Engineer&descAlignY=60&descSize=18&descColor=00F5FF"

      - name: Convert SVG to PNG
        run: |
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1000 hero-banner.svg -o hero-banner.png

      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hero-banner.png
          git diff --cached --quiet || git commit -m "chore: update hero banner PNG"
          git push
